<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>广东省真实3D地图</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #info {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        background-color: rgba(0, 30, 60, 0.7);
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 150, 255, 0.5);
        border: 1px solid rgba(0, 150, 255, 0.3);
        z-index: 10;
      }
      h1 {
        margin: 0 0 10px 0;
        font-size: 24px;
        color: #00a8ff;
        text-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
      }
      #region-info {
        font-size: 16px;
        margin-top: 10px;
      }
      canvas {
        display: block;
      }
      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #00a8ff;
        font-size: 20px;
        text-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
      }
      .legend {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background-color: rgba(0, 30, 60, 0.7);
        padding: 10px;
        border-radius: 8px;
        color: white;
        box-shadow: 0 0 15px rgba(0, 150, 255, 0.5);
        border: 1px solid rgba(0, 150, 255, 0.3);
      }
      .legend-item {
        display: flex;
        align-items: center;
        margin: 5px 0;
      }
      .legend-color {
        width: 20px;
        height: 20px;
        margin-right: 10px;
        border-radius: 3px;
      }
      .culture-card {
        position: absolute;
        top: 20px;
        right: 20px;
        background-color: rgba(0, 30, 60, 0.9);
        padding: 20px;
        border-radius: 8px;
        color: white;
        box-shadow: 0 0 15px rgba(0, 150, 255, 0.5);
        border: 1px solid rgba(0, 150, 255, 0.3);
        z-index: 20;
        width: 300px;
      }

      .culture-card-content {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .culture-button {
        background-color: #00a8ff;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      .culture-button:hover {
        background-color: #0088cc;
      }

      .culture-list {
        max-height: 200px;
        overflow-y: auto;
      }

      .culture-item {
        display: flex;
        align-items: center;
        padding: 8px;
        margin: 5px 0;
        background-color: rgba(0, 150, 255, 0.1);
        border-radius: 5px;
        cursor: pointer;
      }

      .culture-item:hover {
        background-color: rgba(0, 150, 255, 0.2);
      }

      .culture-item-icon {
        width: 36px;
        height: 36px;
        border-radius: 5px;
        margin-right: 10px;
        background-size: cover;
        background-position: center;
      }

      .culture-item-name {
        font-size: 14px;
        font-weight: 500;
      }

      .culture-item-type {
        font-size: 12px;
        color: #88ccff;
      }

      .back-home {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background-color: rgba(0, 30, 60, 0.8);
        padding: 10px 20px;
        border-radius: 8px;
        color: white;
        font-size: 14px;
        border: 1px solid rgba(0, 150, 255, 0.4);
        z-index: 10;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .back-home:hover {
        background-color: rgba(0, 150, 255, 0.3);
        box-shadow: 0 0 15px rgba(0, 150, 255, 0.4);
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h1>广东省3D地图</h1>
      <div>点击地区可查看详情</div>
      <div id="region-info">请选择一个地区</div>
    </div>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background-color: #0088cc"></div>
        <div>珠三角地区</div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #00cc88"></div>
        <div>粤东地区</div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #8800cc"></div>
        <div>粤西地区</div>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: #cc8800"></div>
        <div>粤北地区</div>
      </div>
    </div>
    <div class="loading" id="loading">加载中...</div>
    <div id="culture-card" class="culture-card" style="display: none;">
      <div class="culture-card-content">
        <h2 id="culture-title">地区文化</h2>
        <img
          id="culture-image"
          src=""
          alt="文化图片"
          style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px"
        />
        <p id="culture-description">这里是地区的文化介绍。</p>
        <div id="culture-list" class="culture-list"></div>
        <button id="culture-button" class="culture-button">了解更多</button>
      </div>
    </div>
    <div class="back-home" onclick="goBackHome()">返回首页</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/r17/Stats.min.js"
      type="module"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.6.1/d3.min.js"></script>
    <script>
      const scene = new THREE.Scene()
      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      )
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
      })
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.setClearColor(0x000a14, 1)
      document.body.appendChild(renderer.domElement)

      const regionDefinitions = {
        'pearl-delta': {
          name: '珠三角地区',
          color: 0x0088cc,
          highlightColor: 0x00a8ff,
          cities: ['广州市', '深圳市', '珠海市', '佛山市', '中山市', '东莞市', '惠州市', '江门市', '肇庆市'],
          cityDistrictCodes: ['440100', '440300', '440400', '440600', '442000', '441900', '441300', '440700', '441200']
        },
        east: {
          name: '粤东地区',
          color: 0x00cc88,
          highlightColor: 0x00ffaa,
          cities: ['汕头市', '潮州市', '揭阳市', '汕尾市'],
          cityDistrictCodes: ['440500', '445100', '445200', '441500']
        },
        west: {
          name: '粤西地区',
          color: 0x8800cc,
          highlightColor: 0xaa00ff,
          cities: ['湛江市', '茂名市', '阳江市'],
          cityDistrictCodes: ['440800', '440900', '441700']
        },
        north: {
          name: '粤北地区',
          color: 0xcc8800,
          highlightColor: 0xff9900,
          cities: ['韶关市', '清远市', '梅州市', '河源市', '云浮市'],
          cityDistrictCodes: ['440200', '441800', '441400', '441600', '445300']
        }
      }

      const heritageData = {
        '珠三角地区': [
          { name: '粤剧', type: '传统戏剧', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Cantonese%20opera%20performance%20traditional%20costumes&image_size=landscape_4_3', description: '中国四大剧种之一，以粤语演唱' },
          { name: '岭南画派', type: '传统美术', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Lingnan%20Chinese%20painting%20mountains%20water&image_size=landscape_4_3', description: '融合中西绘画技法的现代中国画流派' },
          { name: '广绣', type: '传统技艺', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Cantonese%20embroidery%20colorful%20patterns&image_size=landscape_4_3', description: '中国四大名绣之一，针法细腻' },
          { name: '沙湾飘色', type: '民俗活动', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=traditional%20Chinese%20parade%20colorful%20costumes&image_size=landscape_4_3', description: '极具特色的民间艺术表演' }
        ],
        '粤东地区': [
          { name: '潮剧', type: '传统戏剧', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Teochew%20opera%20elegant%20costumes&image_size=landscape_4_3', description: '用潮州话演唱的地方戏曲' },
          { name: '潮绣', type: '传统技艺', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chaozhou%20embroidery%20gold%20thread&image_size=landscape_4_3', description: '以金碧辉煌著称的刺绣艺术' },
          { name: '英歌舞', type: '民俗舞蹈', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Yingge%20dance%20traditional%20weapons&image_size=landscape_4_3', description: '阳刚威武的广场舞蹈' },
          { name: '潮州木雕', type: '传统美术', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chaozhou%20wood%20carving%20intricate&image_size=landscape_4_3', description: '精雕细琢的木雕艺术' }
        ],
        '粤西地区': [
          { name: '雷剧', type: '传统戏剧', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Leizhou%20opera%20local%20style&image_size=landscape_4_3', description: '雷州方言戏曲' },
          { name: '遂溪醒狮', type: '民俗活动', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20lion%20dance%20performance&image_size=landscape_4_3', description: '极具阳刚之美的狮舞' },
          { name: '木偶戏', type: '传统戏剧', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20puppet%20show&image_size=landscape_4_3', description: '历史悠久的傀儡戏' },
          { name: '端砚制作', type: '传统技艺', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Chinese%20ink%20stone%20making&image_size=landscape_4_3', description: '中国四大名砚之首' }
        ],
        '粤北地区': [
          { name: '客家山歌', type: '传统音乐', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Hakka%20folk%20song%20mountain%20village&image_size=landscape_4_3', description: '客家文化的瑰宝' },
          { name: '围龙屋建筑', type: '传统建筑', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Hakka%20round%20house%20architecture&image_size=landscape_4_3', description: '独特的客家民居建筑' },
          { name: '舞火龙', type: '民俗活动', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=fire%20dragon%20dance%20festival&image_size=landscape_4_3', description: '壮观的民间节庆活动' },
          { name: '竹编技艺', type: '传统技艺', image: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=bamboo%20weaving%20craft&image_size=landscape_4_3', description: '精巧的竹艺编织' }
        ]
      }

      const ambientLight = new THREE.AmbientLight(0x404050, 0.8)
      scene.add(ambientLight)

      const directionalLight = new THREE.DirectionalLight(0x4080ff, 0.7)
      directionalLight.position.set(1, 1, 1)
      scene.add(directionalLight)

      const pointLight = new THREE.PointLight(0x00a8ff, 1, 100)
      pointLight.position.set(0, 10, 0)
      scene.add(pointLight)

      function animateLight() {
        const time = Date.now() * 0.001
        pointLight.position.x = Math.sin(time) * 10
        pointLight.position.z = Math.cos(time) * 10
        requestAnimationFrame(animateLight)
      }
      animateLight()

      camera.position.set(0, 12, 20)
      camera.lookAt(0, 0, 0)

      const backgroundGlow = createBackgroundGlow()
      scene.add(backgroundGlow)

      addParticleSystem()

      let controls
      setupControls()

      const cityMeshes = {}
      const regionGroups = {}
      const mapGroup = new THREE.Group()
      scene.add(mapGroup)

      loadGuangdongMap()

      async function loadGuangdongMap() {
        try {
          var url = 'https://geo.datav.aliyun.com/areas_v3/bound/440000_full.json'
          var request = new XMLHttpRequest()
          request.open('get', url)
          request.send(null)
          request.onload = function () {
            if (request.status == 200) {
              var json = JSON.parse(request.responseText)
              createGuangdongMap(json)
            }
          }
        } catch (error) {
          console.error('加载地图数据失败:', error)
          document.getElementById('loading').innerHTML = '加载地图数据失败，请刷新重试'
        }
      }

      function createGuangdongMap(json) {
        Object.keys(regionDefinitions).forEach((regionId) => {
          const group = new THREE.Group()
          group.name = regionId
          group.userData = regionDefinitions[regionId]
          regionGroups[regionId] = group
          mapGroup.add(group)
        })

        if (json && json.features) {
          const bounds = calculateBounds(json.features)
          const center = [(bounds.minX + bounds.maxX) / 2, (bounds.minY + bounds.maxY) / 2]
          const scale = 20 / Math.max(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY)

          json.features.forEach((feature) => {
            const adcode = feature.properties.adcode
            let regionId = determineRegion(adcode)

            if (regionId) {
              const regionData = regionDefinitions[regionId]
              const cityMesh = createCityMesh(feature, center, scale, regionData)
              regionGroups[regionId].add(cityMesh)
              cityMeshes[adcode] = cityMesh
            }
          })

          document.getElementById('loading').style.display = 'none'
        }
      }

      function determineRegion(adcode) {
        for (const regionId in regionDefinitions) {
          adcode = adcode.toString()
          if (regionDefinitions[regionId].cityDistrictCodes.includes(adcode)) {
            return regionId
          }
        }
        return null
      }

      function createCityMesh(feature, center, scale, regionData) {
        const shape = new THREE.Shape()

        const coordinates =
          feature.geometry.type === 'MultiPolygon'
            ? feature.geometry.coordinates[0][0]
            : feature.geometry.coordinates[0]

        if (coordinates.length >= 3) {
          const firstPoint = coordinates[0]
          shape.moveTo((firstPoint[0] - center[0]) * scale, (firstPoint[1] - center[1]) * scale)

          for (let i = 1; i < coordinates.length; i++) {
            const point = coordinates[i]
            shape.lineTo((point[0] - center[0]) * scale, (point[1] - center[1]) * scale)
          }

          shape.closePath()

          const extrudeSettings = {
            depth: 0.5,
            bevelEnabled: true,
            bevelThickness: 0.1,
            bevelSize: 0.1,
            bevelSegments: 3
          }

          const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings)

          const material = new THREE.MeshPhongMaterial({
            color: regionData.color,
            transparent: true,
            opacity: 0.9,
            specular: 0x111111,
            shininess: 30
          })

          const mesh = new THREE.Mesh(geometry, material)

          const edges = new THREE.EdgesGeometry(geometry)
          const line = new THREE.LineSegments(
            edges,
            new THREE.LineBasicMaterial({
              color: 0x00ffff,
              transparent: true,
              opacity: 0.7
            })
          )

          mesh.userData = {
            adcode: feature.properties.adcode,
            name: feature.properties.name,
            regionId: regionData.id,
            regionData: regionData
          }

          const group = new THREE.Group()
          group.add(mesh)
          group.add(line)
          group.userData = {
            adcode: feature.properties.adcode,
            name: feature.properties.name,
            regionId: regionData.id,
            regionData: regionData
          }

          return group
        }

        const emptyGroup = new THREE.Group()
        return emptyGroup
      }

      function calculateBounds(features) {
        let minX = Infinity
        let minY = Infinity
        let maxX = -Infinity
        let maxY = -Infinity

        features.forEach((feature) => {
          const coordinates =
            feature.geometry.type === 'MultiPolygon'
              ? feature.geometry.coordinates[0][0]
              : feature.geometry.coordinates[0]

          coordinates.forEach((point) => {
            minX = Math.min(minX, point[0])
            minY = Math.min(minY, point[1])
            maxX = Math.max(maxX, point[0])
            maxY = Math.max(maxY, point[1])
          })
        })

        return { minX, minY, maxX, maxY }
      }

      function setupControls() {
      }

      function createBackgroundGlow() {
        const geometry = new THREE.SphereGeometry(30, 32, 32)
        const material = new THREE.MeshBasicMaterial({
          color: 0x004080,
          transparent: true,
          opacity: 0.1,
          side: THREE.BackSide
        })
        return new THREE.Mesh(geometry, material)
      }

      function addParticleSystem() {
        const particlesGeometry = new THREE.BufferGeometry()
        const particleCount = 1000

        const posArray = new Float32Array(particleCount * 3)

        for (let i = 0; i < particleCount * 3; i++) {
          posArray[i] = (Math.random() - 0.5) * 40
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3))

        const particlesMaterial = new THREE.PointsMaterial({
          size: 0.05,
          color: 0x00a8ff,
          transparent: true,
          opacity: 0.8
        })

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial)
        scene.add(particlesMesh)

        function animateParticles() {
          particlesMesh.rotation.y += 0.0005
          requestAnimationFrame(animateParticles)
        }
        animateParticles()
      }

      function createStarfield() {
        const starGeometry = new THREE.BufferGeometry()
        const starVertices = []
        const starCount = 1000

        for (let i = 0; i < starCount; i++) {
          const x = (Math.random() - 0.5) * 2000
          const y = (Math.random() - 0.5) * 2000
          const z = (Math.random() - 0.5) * 2000
          starVertices.push(x, y, z)
        }

        starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3))

        const starMaterial = new THREE.PointsMaterial({
          size: 2,
          color: 0xffffff,
          transparent: true,
          opacity: 0.8
        })

        const starField = new THREE.Points(starGeometry, starMaterial)
        scene.add(starField)
      }

      createStarfield()

      const raycaster = new THREE.Raycaster()
      const mouse = new THREE.Vector2()
      let hoveredRegion = null
      let selectedRegion = null

      function onMouseMove(event) {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1

        raycaster.setFromCamera(mouse, camera)
        const intersects = raycaster.intersectObjects(mapGroup.children, true)

        Object.keys(regionGroups).forEach((regionId) => {
          if (regionGroups[regionId] !== selectedRegion) {
            resetHighlight(regionGroups[regionId])
          }
        })

        if (intersects.length > 0) {
          let object = intersects[0].object

          while (object.parent && !object.userData.regionId && !object.userData.adcode) {
            object = object.parent
          }

          if (
            (object.userData.regionId || object.userData.adcode) &&
            (!selectedRegion || selectedRegion.name !== object.userData.regionId)
          ) {
            const regionId =
              object.userData.regionId ||
              (object.userData.adcode ? determineRegion(object.userData.adcode) : null)

            if (regionId && regionGroups[regionId]) {
              hoveredRegion = regionGroups[regionId]
              setHighlight(hoveredRegion)
            }
          }
        } else {
          hoveredRegion = null
        }
      }

      function onClick(event) {
        if (hoveredRegion) {
          if (selectedRegion && selectedRegion !== hoveredRegion) {
            resetHighlight(selectedRegion)
          }

          selectedRegion = hoveredRegion
          setHighlight(selectedRegion, true)
          updateRegionInfo(selectedRegion.userData)
          focusCameraOnRegion(selectedRegion)
          animateSelectedRegion(selectedRegion)
          showCultureCard(selectedRegion.userData)
        }
      }

      function showCultureCard(regionData) {
        const cultureCard = document.getElementById('culture-card')
        const cultureTitle = document.getElementById('culture-title')
        const cultureImage = document.getElementById('culture-image')
        const cultureDescription = document.getElementById('culture-description')
        const cultureList = document.getElementById('culture-list')
        const cultureButton = document.getElementById('culture-button')

        cultureTitle.textContent = `${regionData.name} 非遗文化`
        cultureDescription.textContent = getCultureDescription(regionData.name)
        cultureImage.src = getRegionImage(regionData.name)

        const heritages = heritageData[regionData.name] || []
        cultureList.innerHTML = heritages.map((item) => `
          <div class="culture-item">
            <div class="culture-item-icon" style="background-image: url('${item.image}')"></div>
            <div>
              <div class="culture-item-name">${item.name}</div>
              <div class="culture-item-type">${item.type}</div>
            </div>
          </div>
        `).join('')

        cultureButton.onclick = () => {
          window.parent.postMessage({ action: 'navigateTo', path: '/heritage' }, '*')
        }

        cultureCard.style.display = 'block'
      }

      function getCultureDescription(regionName) {
        const descriptions = {
          '珠三角地区': '珠三角地区是岭南文化的核心区域，汇集了广府文化的精华。这里是非遗文化最集中、最丰富的地区，粤剧、广绣、岭南画派等享誉海内外。',
          '粤东地区': '粤东地区以潮汕文化为代表，保留了丰富的传统民俗。潮剧、英歌舞、潮绣等文化瑰宝在这里代代相传，展现了独特的地域风情。',
          '粤西地区': '粤西地区拥有独特的雷州文化和海洋文化。雷剧、醒狮、木偶戏等民间艺术形式独具特色，端砚制作更是闻名天下。',
          '粤北地区': '粤北地区是客家文化的重要发源地，客家山歌、围龙屋建筑等文化遗产承载着客家人的历史记忆，展现了山区独特的文化风貌。'
        }
        return descriptions[regionName] || '暂无文化介绍。'
      }

      function getRegionImage(regionName) {
        const images = {
          '珠三角地区': 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Pearl%20River%20Delta%20Guangzhou%20cityscape%20modern%20traditional&image_size=landscape_16_9',
          '粤东地区': 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=eastern%20Guangdong%20Chaozhou%20ancient%20city%20temples&image_size=landscape_16_9',
          '粤西地区': 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=western%20Guangdong%20coastal%20fishing%20villages&image_size=landscape_16_9',
          '粤北地区': 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=north%20Guangdong%20mountain%20Hakka%20villages&image_size=landscape_16_9'
        }
        return images[regionName] || 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=Guangdong%20cultural%20heritage%20traditional%20art&image_size=landscape_16_9'
      }

      function focusCameraOnRegion(region) {
        const box = new THREE.Box3().setFromObject(region)
        const center = new THREE.Vector3()
        box.getCenter(center)

        const size = new THREE.Vector3()
        box.getSize(size)

        gsap.to(camera.position, {
          duration: 1,
          x: center.x,
          y: center.y + size.length() * 0.5,
          z: center.z + size.length() * 1.2,
          ease: 'power2.inOut',
          onUpdate: function () {
            camera.lookAt(center)
          }
        })
      }

      function animateSelectedRegion(region) {
        gsap.to(region.position, {
          duration: 0.5,
          y: 0.5,
          ease: 'back.out(1.7)',
          yoyo: true,
          repeat: 1
        })
      }

      function setHighlight(regionGroup, isSelected = false) {
        const regionData = regionGroup.userData

        regionGroup.traverse((child) => {
          if (child.isMesh && child.material) {
            child.material.color.setHex(regionData.highlightColor)
            child.material.opacity = 0.9

            child.material.emissive = new THREE.Color(regionData.highlightColor)
            child.material.emissiveIntensity = isSelected ? 0.3 : 0.2
          }

          if (child.isLineSegments && child.material) {
            child.material.color.setHex(0x00ffff)
            child.material.opacity = isSelected ? 0.9 : 0.8
          }
        })

        if (isSelected) {
          regionGroup.scale.set(1.1, 1.1, 1.1)
        } else {
          regionGroup.scale.set(1.05, 1.05, 1.05)
        }
      }

      function resetHighlight(regionGroup) {
        const regionData = regionGroup.userData

        regionGroup.traverse((child) => {
          if (child.isMesh && child.material) {
            child.material.color.setHex(regionData.color)
            child.material.opacity = 0.9

            child.material.emissive = new THREE.Color(0x000000)
            child.material.emissiveIntensity = 0
          }

          if (child.isLineSegments && child.material) {
            child.material.color.setHex(0x00ffff)
            child.material.opacity = 0.7
          }
        })

        regionGroup.scale.set(1, 1, 1)
      }

      function updateRegionInfo(regionData) {
        const infoElement = document.getElementById('region-info')
        infoElement.innerHTML = `
          <h3 style="margin: 5px 0; color: #00a8ff;">${regionData.name}</h3>
          <div>城市: ${regionData.cities.join('、')}</div>
          <div style="color: #88ccff;">非遗项目: ${(heritageData[regionData.name] || []).length} 项</div>
        `
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      }

      function floatAnimation() {
        const time = Date.now() * 0.001

        mapGroup.position.y = Math.sin(time * 0.5) * 0.3

        backgroundGlow.scale.set(
          1 + Math.sin(time * 0.3) * 0.05,
          1 + Math.sin(time * 0.5) * 0.05,
          1 + Math.sin(time * 0.4) * 0.05
        )
      }

      function animate() {
        requestAnimationFrame(animate)
        floatAnimation()
        renderer.render(scene, camera)
      }

      function goBackHome() {
        window.parent.postMessage({ action: 'navigateTo', path: '/home' }, '*')
      }

      window.addEventListener('mousemove', onMouseMove, false)
      window.addEventListener('click', onClick, false)
      window.addEventListener('resize', onWindowResize, false)
      animate()
    </script>
  </body>
</html>
